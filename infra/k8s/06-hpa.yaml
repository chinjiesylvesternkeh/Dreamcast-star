apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dreamcast-backend-hpa
  namespace: dreamcast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dreamcast-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
