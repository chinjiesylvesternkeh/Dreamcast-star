apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreamcast-backend
  namespace: dreamcast
  labels:
    app: dreamcast-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dreamcast-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dreamcast-backend
    spec:
      containers:
        - name: backend
          # Replaced at deploy time by the CI/CD pipeline with the built
          # image tag (see Jenkinsfile) — this default is dev-only.
          image: gcr.io/YOUR_GCP_PROJECT/dreamcast-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dreamcast-config
            - secretRef:
                name: dreamcast-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: dreamcast-backend
  namespace: dreamcast
spec:
  selector:
    app: dreamcast-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
