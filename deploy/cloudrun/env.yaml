# Non-secret settings for the Cloud Run service and migration job.
# Secrets (database URL, JWT key, Anthropic key, Play credentials) come from
# Secret Manager — see setup.ps1. PORT is set by Cloud Run; don't add it here.
APP_ENV: production
DEBUG: "false"
LOG_LEVEL: INFO
ALLOWED_ORIGINS: "[]" # the Android app doesn't need CORS
PAYMENT_PROVIDER: google_play
GOOGLE_PLAY_PACKAGE_NAME: com.dreamcast.app
FREE_TIER_WEEKLY_LIMIT: "1"
AI_MODEL_FREE: claude-haiku-5-5
AI_MODEL_PAID: claude-sonnet-5-5
AI_EFFORT: medium
# db-f1-micro allows 25 connections: 2 workers x (3 + 2) x 2 instances = 20.
WEB_CONCURRENCY: "2"
DB_POOL_SIZE: "3"
DB_MAX_OVERFLOW: "2"
