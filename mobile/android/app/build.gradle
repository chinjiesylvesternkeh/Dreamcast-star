plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase is optional until a project-specific google-services.json is added.
if (file("$projectDir/google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

// --- Release signing config ---
// Create android/key.properties (NEVER commit it) with:
//   storePassword=...
//   keyPassword=...
//   keyAlias=upload
//   storeFile=/absolute/path/to/upload-keystore.jks
// Generate the keystore once with:
//   keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
//     -keysize 2048 -validity 10000 -alias upload
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (isReleaseTask && !keystorePropertiesFile.exists()) {
    throw new GradleException(
        "Release builds require android/key.properties and a non-debug upload keystore. " +
        "Copy key.properties.example, fill it in, then retry."
    )
}

android {
    namespace "com.dreamcast.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.dreamcast.app"
        minSdkVersion 23          // Android 6.0 — required floor for Play Billing
        targetSdkVersion 36       // Google Play requires API 36 for new apps/updates from 31 Aug 2026
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Debug signing remains available for local non-release builds;
            // release tasks fail above until a real upload key is configured.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}
